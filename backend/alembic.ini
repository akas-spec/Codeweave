# Alembic Configuration File
# CodeWeave Phase 4 — Database Migrations

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date
timezone = UTC

# The database URL is loaded from app.config.settings in env.py
# This value is overridden at runtime — it serves as a fallback only.
sqlalchemy.url = postgresql+asyncpg://codeweave:codeweave@localhost:5434/codeweave

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
